# Basic SNMP configuration
rocommunity public
syslocation "Telecore Virtual Data Center"
syscontact "admin@telecore.com"

# Bind Custom OIDs to internal Bash scripts using 'extend'
# When the server asks for these OIDs, snmpd will run the script and return the output
extend .1.3.6.1.4.1.99999.1.1 nodeInfo /usr/local/bin/get_node_info.sh
extend .1.3.6.1.4.1.99999.1.5 diskStatus /usr/local/bin/check_disk.sh
extend .1.3.6.1.4.1.99999.1.6 tempStatus /usr/local/bin/check_temp.sh
extend .1.3.6.1.4.1.99999.1.7 congestionStatus /usr/local/bin/check_congestion.sh
