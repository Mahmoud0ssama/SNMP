version: '3.8'

networks:
  telecom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1

services:
  # ==========================================
  # 1. CORE NETWORK
  # ==========================================
  core-hlr:
    build: 
      context: .
      dockerfile: Dockerfile.telecom-node
    container_name: core-hlr
    networks:
      telecom_net:
        ipv4_address: 172.25.0.5
    volumes:
      - ./nodes/core-hlr/hardware_specs.cfg:/etc/node/hardware_specs.cfg:ro
    environment:
      - NMS_SERVER_IP=172.25.0.1
      - NODE_NAME=Core_HLR
      - NODE_TYPE=HLR

  core-sgsn:
    build: 
      context: .
      dockerfile: Dockerfile.telecom-node
    container_name: core-sgsn
    networks:
      telecom_net:
        ipv4_address: 172.25.0.6
    volumes:
      - ./nodes/core-sgsn/hardware_specs.cfg:/etc/node/hardware_specs.cfg:ro
    environment:
      - NMS_SERVER_IP=172.25.0.1
      - NODE_NAME=Core_SGSN
      - NODE_TYPE=SGSN

  # ==========================================
  # 2. CAIRO REGION (172.25.0.10 -> 172.25.0.19)
